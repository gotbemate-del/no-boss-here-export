name: 每 5 分鐘匯出市集資料（接力）

# 這個 repo 是公開的，GitHub Actions 不限分鐘；網站程式在私人的 bozhan9527-ux/No_boss_here。
# 每一輪用部署金鑰 MARKET_SSH_KEY（No_boss_here 的 Deploy key，可寫入、不會過期）拿最新的匯出程式，
# 匯出攤位、照片、人次、天氣，有變化就推到 No_boss_here 的 site 分支，
# 再把 site 直接上傳到 Cloudflare Pages（scripts/pages-deploy.sh；2026-11-03 起不靠 Pages 的 Git 部署）。
# 需要 secrets：MARKET_SSH_KEY、CLOUDFLARE_API_TOKEN（Cloudflare Pages：編輯）、CLOUDFLARE_ACCOUNT_ID。
# 一個工作連續跑約 5 小時 20 分，結束前自己開下一輪；每 3 小時的排程是備援。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: export-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  MARKET_REPO: git@github.com:bozhan9527-ux/No_boss_here.git

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 放好部署金鑰
        env:
          KEY: ${{ secrets.MARKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: 每 5 分鐘匯出一次
        env:
          PUSH_URL: ${{ env.MARKET_REPO }}
          # 每天備份公開數字到私人 repo（scripts/archive-once.sh，2026-11-01）；沒設這兩個 secret 就跳過
          ARCHIVE_REPO: ${{ secrets.ARCHIVE_REPO }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          # 直接上傳到 Cloudflare Pages 用（2026-11-03）；記上一次上傳的版本，沒新版本就不傳
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_FILE: ${{ runner.temp }}/pages-deployed
        run: |
          end=$((SECONDS + 320 * 60))
          # 連續拿不到匯出程式就提早結束，讓下一輪換一台新機器重開（2026-11-04 拿不到匯出程式，停擺 5 小時）
          clone_fail=0
          last_q=""
          while [ "$SECONDS" -lt "$end" ]; do
            echo "== $(TZ=Asia/Taipei date '+%H:%M') =="
            # 每一輪重新拿最新的匯出程式（只拿 scripts 和設定），推了新程式不用重開接力
            rm -rf market
            if git clone -q --depth=1 --filter=blob:none --sparse "$PUSH_URL" market \
              && git -C market sparse-checkout set scripts src/lib; then
              clone_fail=0
              (cd market && bash scripts/export-once.sh) || echo "這一輪失敗，5 分鐘後再試"
              # 推完 site 就直接上傳到 Cloudflare Pages（舊版程式沒有這支就跳過）
              if [ -f market/scripts/pages-deploy.sh ]; then
                (cd market && bash scripts/pages-deploy.sh) || echo "這一輪上傳失敗，5 分鐘後再試"
              fi
            else
              clone_fail=$((clone_fail + 1))
              echo "拿不到匯出程式（部署金鑰沒設好？），連續第 $clone_fail 次"
              if [ "$clone_fail" -ge 2 ]; then echo "連續 2 次拿不到，提早結束這一輪，換下一輪重開"; break; fi
            fi
            # 排隊上線（2026-11-08）：等 5 分鐘的時候每 20 秒看一下排隊分支 q/*，出現新的才提早開始；
            # 同一批清不掉、或這輪拿不到程式，就照常等滿 5 分鐘（免得一直連跑或一直重開）
            waited=0
            while [ "$waited" -lt 300 ]; do
              sleep 20; waited=$((waited + 20))
              now_q="$(git ls-remote "$PUSH_URL" 'refs/heads/q/*' 2>/dev/null)"
              if [ "$clone_fail" -eq 0 ] && [ -n "$now_q" ] && [ "$now_q" != "$last_q" ]; then last_q="$now_q"; echo "有新的排隊分支，提早開始"; break; fi
            done
          done

      - name: 接力：開下一輪
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run export-loop.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
